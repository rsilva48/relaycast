name: Build the Windows companion

# Builds the Relaycast installer (companion/dist/Relaycast-Setup-<version>.exe).
# Pull requests and manual runs keep it as an artifact; version tags also
# attach it to the release that build-and-release.yml publishes (the release is created
# by whichever workflow gets there first; this one never marks it as latest).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'companion/**'
      - 'server/**'
      - '.github/workflows/companion.yml'

permissions:
  contents: read

jobs:
  installer:
    name: Installer (Windows, Node 24)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Test the server
        working-directory: server
        run: npm test
      - name: Build the installer
        working-directory: companion
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Relaycast-Setup
          path: companion/dist/Relaycast-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.ref_type == 'tag'
        with:
          name: ${{ github.ref_name }}
          make_latest: 'false'
          files: companion/dist/Relaycast-Setup-*.exe
